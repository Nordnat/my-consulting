services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: rafalkamieniarz-web:latest
    container_name: rafalkamieniarz-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - CONTACT_EMAIL_TO=${CONTACT_EMAIL_TO:-rafal@rafalkamieniarz.com}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
